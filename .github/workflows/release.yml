name: Release

# Builds the extension and attaches the zip to a GitHub release. AMO
# submission is deliberately not automated — uploads to
# https://addons.mozilla.org/developers/ are done manually so each
# version gets an explicit review before it ships to users.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.13)"
        required: true
      name:
        description: "Release name (optional)"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint built extension
        run: npx web-ext lint --source-dir dist

      - name: Package extension
        run: npx web-ext build --source-dir dist --artifacts-dir build --overwrite-dest

      - name: Resolve tag and version
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF##*/}"
          fi
          NAME="${{ github.event.inputs.name }}"
          [ -z "$NAME" ] && NAME="$TAG"
          ZIP_PATH="$(ls build/*.zip | head -n1)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          NAME="${{ steps.meta.outputs.name }}"
          ZIP="${{ steps.meta.outputs.zip_path }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --title "$NAME" --generate-notes
          fi
