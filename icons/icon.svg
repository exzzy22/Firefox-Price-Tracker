<!-- Source for icon-48/64/96/128.png. 16 and 32 come from icon-small.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <mask id="hole">
      <rect x="-64" y="-64" width="256" height="256" fill="#fff"/>
      <circle cx="64" cy="43" r="6.5" fill="#000"/>
    </mask>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <!-- Price tag, drawn upright and turned to point up-left. -->
  <g transform="rotate(-45 64 64)">
    <path d="M64 26 L82 44 V102 H46 V44 Z" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round" mask="url(#hole)"/>
