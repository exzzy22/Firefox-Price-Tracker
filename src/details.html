<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Price Tracker — Details</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="details">
  <header class="details-header">
    <h1>Tracked Items</h1>
    <div>
      <button id="refreshBtn" class="btn btn-primary">
        <span id="refreshSpinner" class="spinner" hidden></span>
        <span id="refreshLabel">Force Check</span>
      </button>
    </div>
  </header>

  <section class="details-controls">
    <label for="intervalInput">Check interval (minutes)</label>
    <input id="intervalInput" class="input" type="number" min="1" value="60" />
    <button id="saveIntervalBtn" class="btn btn-secondary">Save</button>
    <div id="detailsStatus" class="status-text" style="flex:1;text-align:right;margin:0"></div>
  </section>

  <section id="list" class="details-list">
    <div class="empty">(loading)</div>
  </section>

  <script src="details.js"></script>
</body>
</html>
