<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Price Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="popup">
  <header class="header">
    <div class="brand">
      <img class="brand-icon" src="icons/icon-48.png" alt="" width="22" height="22" />
      <h1 class="title">Price Tracker</h1>
    </div>
    <div class="header-actions">
      <button id="refreshBtn" class="icon-btn" title="Check all prices now" aria-label="Check all prices now"></button>
      <button id="openDetailsBtn" class="icon-btn" title="Open dashboard" aria-label="Open dashboard"></button>
    </div>
  </header>

  <section id="currentCard" class="current is-loading" aria-live="polite">
    <div class="current-main">
      <div class="thumb thumb-lg" id="currentThumb"></div>
      <div class="current-text">
        <div id="currentSite" class="eyebrow"></div>
        <div id="currentTitle" class="current-title">Looking for a price…</div>
        <div class="current-price-row">
          <span id="currentPrice" class="current-price"></span>
          <span id="currentBadge" class="badge" hidden></span>
        </div>
        <div id="currentNote" class="note"></div>
      </div>
    </div>
    <div class="card-actions">
      <button id="pickBtn" class="btn btn-secondary">Pick price</button>
      <button id="trackBtn" class="btn btn-primary" disabled>Track price</button>
    </div>
  </section>

  <section class="list-section">
    <div class="list-header">
      <h2 class="section-title">Tracked <span id="count" class="count"></span></h2>
      <span id="status" class="status" aria-live="polite"></span>
    </div>
    <ul id="list" class="list"></ul>
  </section>

  <script src="popup.js"></script>
</body>
</html>
