<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Price Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="popup">
  <header class="header">
    <h1 class="title">Price Tracker</h1>
    <div class="header-actions">
      <button id="openDetailsBtn" class="icon-btn" title="Open details" aria-label="Open details">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M10 20H4v-6M20 4 13 11M4 20l7-7"/></svg>
      </button>
    </div>
  </header>

  <section id="currentCard" class="card current" aria-live="polite">
    <div class="card-body">
      <div id="currentTitle" class="product-title">Loading current page…</div>
      <div id="currentPrice" class="product-price"></div>
      <div id="selectorNote" class="note"></div>
    </div>
    <div class="card-actions">
      <button id="pickBtn" class="btn btn-secondary">Pick element</button>
      <button id="trackBtn" class="btn btn-primary">Track price</button>
    </div>
  </section>

  <section class="list-section">
    <div class="list-header">
      <h2 class="section-title">Tracked</h2>
      <button id="refreshBtn" class="btn btn-ghost">
        <span id="refreshSpinner" class="spinner" hidden></span>
        <span id="refreshLabel">Refresh</span>
      </button>
    </div>
    <div id="refreshStatus" class="note"></div>
    <div id="list" class="list" aria-live="polite">
      <div class="empty">(none)</div>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
